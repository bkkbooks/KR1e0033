body:
  text: 春秋考原跋右春秋讞攷傳三書石林先生葉公之所作也自熙寧用事之臣倡為新經之説禍天下學士大夫以談春秋為諱有年矣是書作于絶學之餘所以辟邪説黜異端章明天子遏止人欲其有補于世教為不淺也公之𤣥孫來守延平出是書鋟木而傳之葢有意于淑斯人如此學者其勉旃開禧乙丑九月一日秘閣校勘文林郎南劍州軍事判官真徳秀謹跋案此乃讞考傳三書總跋當在石林春秋傳後今傳之刻本不載是跋仍依永樂大典本附編於此
