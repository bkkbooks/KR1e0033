body:
  text: 春秋考春秋類提要臣等謹按春秋考十六卷宋葉夢得撰是書於寧宗開禧中與春秋傳春秋讞同刻於南劒州元程端學作春秋三傳辨疑多引其説則當時猶有傳本自明以來藏書家皆不著録故朱彛尊經義考注曰已佚帷永樂大典頗載其文以次檢校尚可得什之八九今排比綴輯復勒成書其書大旨在申明所以攻排三傳者實本周之法度制作以為斷初非有所臆測于其間故所言皆論次周典以求合于春秋之法其文辨博縱橫而語有本原率皆典核陳振孫書録解題稱其辨定考究無不精詳殆不誣也原書前有統論其後乃列十二公逐條詮敘而不録經文今悉仍舊例其卷帙則約略篇頁輯為統論三卷隱公以下以次編為十三卷不復拘宋志三十卷之數據夢得自序稱自其讞推之知吾所正為不妄而後可以觀吾考自其考推之知吾所擇為不誣而後可以觀吾傳然書録解題已先列傳次列考次列讞蓋傳其大綱而考讞其發明之義疏也今仍從陳氏之序次于傳後焉乾隆四十九年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀春秋考原序葉子曰吾為春秋讞是正三家之過亦略備矣古之君子不難于攻人之失而難于正巳之是非蓋得失相與為偶者也是非相與為反者也必有得也乃可知其失必有是也乃可斥其非而世之言經者或未有得而遽言其失莫知是而遽詆其非好惡豫奪惟己之私終無以相勝徒紛然多門以亂學者之聽而經愈不明嘗聞之夫子曰蓋有不知而作之者我無是也多聞擇其善者而從之多見而識之知之次也君子之學必自聞見始聞見以多為貴必慎乎其所擇蓋雖孔子之聖猶曰我非生而知之者好古敏以求之者也而頌其德者亦以祖述堯舜憲章文武為首故曰我欲觀夏道杞不足徴也吾得夏時焉我欲觀商宋不足徵也吾得坤乾焉子所謂好古敏以求之者如此則又曰述而不作信而好古竊比于我老彭至于論禮或曰吾聞諸老聃吾以是知學者求之不可不博而擇之不可不審也去古既逺聖人之道不明先王之典籍殘缺幾亡春秋立大法而遺萬世者也不知聖人之道孰與發其義不見先王之典籍孰與定其制當孔子時夏商之禮已無可據韓宣子適魯始見周禮盡在魯地他國蓋無有也至于論爵之辨孟子已不能得其詳甚有至于諸侯惡其害己而去其籍非特文獻之無傳也故吾讀周官至五等諸侯封國之數大國次國小國之軍制與夫諸侯之邦交世相朝者喟然皆知其出于僭亂者之所為而上下數千餘載之間卒未有辨者則居今之世而求古之道兹不亦甚難而不可忽歟雖然文武之道未墜于地六經之所傳百世之所記猶在吾所謂失者非苟去之也以其無當于義也蓋有當之者焉吾所謂非者非臆排之也以其無驗于事也蓋有驗之者焉則亦在夫擇焉而已乃復論次其求古而得之可信不疑者考三十卷吾豈好是多言也哉經之不明也久矣而説者汨之説者之無與正也久矣而昧于古者惑之世果無知經者歟吾不得見也必將有與吾同者自其讞推之知吾之所正為不妄也而後可以觀吾考自其考推之知吾之所擇為不誣也而後可以觀吾傳是非吾之言也蓋皆聖人之道而先王之制吾亦可免于後世矣紹興八年正月旦序
