body:
  text: 春秋考卷四宋葉夢得撰隱公古者謂人君即位之始年不曰一年而曰元年歲之始月不曰一月而曰正月自堯舜以來見之矣元年之稱見于伊訓正月之稱見于舜典非春秋創為之文也蓋君天下之道必慎其始一者數而已聖人不以一第之而曰元曰正者所以慎其始也元者天運之見于氣者也易曰大哉乾元萬物資始乃統天倫元之大體蓋萬物莫不資焉雖天亦在其範圍之內若以事考之則散而為亨與利貞之四德而獨居其先者也故元者善之長也而君子所以長人者必體乎仁仁者元之用也即位之始年謂之元年將示為人上者必如天之元而後可以有其位也貞者四德之終易曰貞正也四德以貞為本故曰事之幹也而君子體之貞固足以幹事蓋推而上之天地之道以貞而觀日月之道以貞而明則夫天下之動非貞孰能一之乎夫以貞為幹則枝葉自是而出者無不皆有所本聖人欲成元之善者固不可舍貞而正也春秋以堯舜之道示後世是以謹是二言而不敢有加損其舉王于二者之間則春秋之法也天子諸侯既合以其世即位則元年者天子諸侯之所同也諸侯受命于天子必自正月始故協時月正日以為之歷而頒天下使無不從我而一則正月者非諸侯之所得與也春秋立法加王于正月之上曰王正月則王固不得不先正于上曰王之正月則諸侯固不得不禀其正于下而萬世之義盡矣三家初不盡明此左氏為周正月以别夏商其陋固不待言穀梁但以無事必舉正月為謹始而不知書王之大法惟公羊以先言王而後言正月為大一統略得其意而未盡漢興公羊學首傳董仲舒為之冠其曰一者萬物之所從始也元者辭之所謂大也謂一為元者視大始而欲正本也又曰春者天之所為也正者王之所為也其意曰上承天之所為而下以正其所為正王道之端云爾以元為大鳥在其為正本也謂正為承天鳥在其為書王也至何休遂以公即位為春秋以元之氣正天之端以天之端正王之政以王之政正諸侯之即位以諸侯之即位正竟內之治五者同日並見相須成體于是為五始之論蓋全本于讖緯上強取天之端而下附益以竟內之治此亦豈公羊之意哉公羊之意且不能知何暇議經吾以是知治春秋之難也杜氏雖不祖公羊其言凡人君即位欲其體元以居正故不言一年一月此亦未嘗以尚書考之也春秋之旨惟四時各加于首月以謹天道書王于正月之上以立王法二者乃為新意四時各加于首月亦不可以春獨生義讀春秋者每以是六言觀之則深不為穿鑿淺不為疏略矣左氏言惠公元妃孟子卒繼室以聲子生隱公又娶于宋故仲子歸于我生桓公杜預謂聲子者孟子之姪娣案孟原本訛作仲今據杜注改諸侯元妃死則次妃攝治內事不得稱夫人故謂之繼室此于禮無見獨公羊以為諸侯娶一國則二國往媵之以姪娣從諸侯一娶九女諸侯不再娶杜預之言或出于此則諸侯不得再娶矣魯臧宣叔娶于鑄生賈及為而死繼室以其姪此姪娣得為繼室之證也且姪娣雖得繼室攝治內事而不稱夫人今言繼室以聲子聲諡也如成風敬嬴之類則惠公蓋成其為夫人矣既有夫人又何娶于宋乎惠公而既有再娶則必不以聲子為繼室死而又加之諡既以聲子為繼室則必不更娶于宋二者不能並立則左氏謂惠公娶于宋者未可據也蓋仲子左氏不知為惠公母而以為桓公母故附㑹云爾然則桓公之母蓋聲子之次也惠公愛之欲以桓公奪隱公而以聲子為繼室隱公又長故終不敢爾使諸侯得再娶而惠公娶于宋在聲子之後則仲子可名以嫡夫人桓公可名以嫡子矣又何難而不以奪隱公春秋亦何以與隱公之得立乎劉原甫以禮宗子雖七十無無主婦謂諸侯必再娶不然無主婦以元妃死而不立繼室也既有繼室攝治內事是亦主婦但不得名夫人爾又援武王生成王之年為非嫡后所出必再娶亦不然武王有亂臣十人而天下治邑姜在其間則武王有天下邑姜尚在也安知成王必邑姜所出而非庶長乎此皆未足以為證若晉平公娶齊少姜而卒魯昭公欲弔之晉候辭公曰非伉儷也請君無辱鄭游吉送葬曰嬖寵之喪不敢釋位而數于守嫡其後齊復請繼室于晋則晉雖娶齊亦未敢以為嫡夫人諸侯亦不以嫡夫人處之可以見當時之制則使惠公雖實嘗娶宋亦安得以為嫡也仲子事吾固疑其非是而史記載惠公嫡夫人無子賤妾聲子生隱公隱公長為娶于宋宋女至而好惠公奪而自妻之生桓公登宋女為夫人以桓公為太子及惠公卒為桓公少故魯人共令隱公攝政乃全與左氏所載本末不同凡司馬遷所載春秋時事大扺皆近于左氏而魯世家于仲子何為獨不取于隱桓疑當時先秦故書又有為此說者故遷用以為正益知春秋事諸家所聞各異要以近經者為得則穀梁之言為有證也杜預以聲子為孟子之姪娣諸侯始娶則同姓之國以姪娣媵元妃死則次妃攝治內事猶不得稱夫人故謂之繼室則姪娣既媵媵即次妃而諸侯不得再娶也論考仲子之宫又云惠公以仲子手文娶之欲以為夫人諸侯無二嫡故隱公成之為立宫是許諸侯得再娶而不得為夫人也夫安有娶而不得為夫人者乎且既以聲子為繼室攝元妃治內事又再娶仲子則何以名之蓋杜氏自不能了此前論參取公羊諸侯一聘九女諸侯不再娶之意相與附㑹後論仲子辭窮則又許其再娶忘其自相違戾至言姪娣為媵亦非是媵于天子為三夫人于諸侯為二世婦本不同姪娣姪娣之制不盡見于後世而媵姪娣禮亦不詳吾固言之矣諸侯不得再娶于禮無正文蓋出于公羊曽子問記孔子之言曰宗子雖七十無無主婦非宗子雖無主婦可也此謂主祭也以類推之諸侯若不得再娶則安得每有夫人乎吾固以為攝矣禮昏義天子后立六官三夫人九嬪二十七世婦八十一御妻以當公卿大夫士之數而曲禮公侯但云有夫人有世婦有妻有妾而不言數公羊言諸侯娶一國則二國往媵之以姪娣從姪兄之子也娣弟也諸侯一聘九女故為不再娶之論按天子后之媵三則三夫人是也三夫人各有姪娣三則九嬪是也合三夫人九嬪是為十二由是等而下之其降殺以三諸侯夫人之媵二則為世婦者當二也夫人與世婦各有姪娣二則謂之妻者當六也合夫人與二世婦六妻是為九天子之后尊矣故不在十二女之數諸侯降于天子故夫人同為九女以婦職名之則天子曰后曰夫人曰嬪諸侯曰夫人曰世婦曰妻而通謂之非以配嫡以别兄子及弟言之則曰姪娣合言之則曰媵夫既以是為定制矣則周官九嬪不列其數以為有其人則充無則闕曲禮公侯夫人世婦妻妾不列數義亦同此無其人尚不得充而况過之乎若許之再娶則其為媵姪娣有不可廢者是與其舊而兩之也豈正家逺色之道乎古者天子在喪則使冢宰攝君百官總已而聼之君猶可攝也若王有故不與祭祀則大宗伯攝位太宰攝之則謂之宰祭大祭祀王后有故不與則大宗伯攝而薦豆籩徹大賓客則攝而載祼后夫人之職莫大于祭祀方其無恙天子猶且得使冢宰攝則后夫人死而以媵攝之不亦可乎所謂攝者攝其職非攝其位猶冢宰之攝君者也以是而言則公羊之言為有證矣春秋之時凡諸侯三夫人皆曰妃有元妃有二妃有下妃亦曰少妃故左氏稱惠公孟子為元妃而記子叔姬妃齊昭公于邾文公見元妃二妃于陳哀公見元妃二妃下妃又謂鄭姚子為少妃此三夫人之别也夫人稱元妃死則以二妃攝行其事皆曰繼室所謂繼室以聲子者也何知攝之二妃為媵也據左氏言臧宣叔繼室以其姪媵姪娣同為九女則媵固得為之矣是以同謂之繼室晉靈公卒晉人議立君趙孟以辰嬴班在九杜祁以狄故讓季隗而已次之班在四則諸侯九女之證也齊小白之夫人三曰王姬徐姬蔡姬長衛姬少衛姬鄭姫葛嬴密姬宋華子凡九人而謂如夫人者六人則通三夫人為九女之證也齊侯娶于魯曰顔懿姬無子姪鬷聲姬生光則夫人有姪娣之證也晉獻公伐驪戎以驪姬歸生奚齊其娣立卓子則世婦有姪娣之證也是先王之遺制猶有可考者乃衛莊公娶于齊東宫得臣之妹曰莊姜又娶于陳曰厲媯晉獻公娶于賈又娶二女于戎曰大戎狐姬小戎子則違禮而再娶矣隱公之事三家所載不同吾皆不敢以為然獨取于榖梁而不盡用其說者推經以為正也蓋左氏以隱為攝穀梁以隱為讓公羊以桓為嫡夫三名豈可以苟得哉古者君薨嗣子諒閒居廬百官總已以聼冡宰謂之攝攝者有君代之行事之名也故成王立幼未能臨位周公抱之負斧扆以朝諸侯凡政令必稱王焉亦謂之攝隱公既已南面稱君有其位者十一年國人諸侯皆稱之公矣而桓未嘗有位也是焉得名攝哉左氏但以隱嘗立桓為太子而奉之夫太子與君不並見也正使如左氏所言隱為君而桓為太子自不可言攝況其事未必然乎則左氏謂攝者不可據矣讓者已所當得不自有而推之與人之名也堯有天下而推之舜舜有天下而推之禹謂之讓故周之有國泰伯不自有而推之仲雍仲雍不自有而推之季歷泰伯終謝而去焉以授于文王故孔子曰三以天下讓民無得而稱焉隱誠長而欲以與桓則去而逃之如吳泰伯可矣既已即位稱君號令征伐無不自己出而桓猶為公子也是焉得名讓哉穀梁但謂不取為公而將以讓桓遂以為讓夫讓安可以探先君之志而特為之哉其曰欲致國焉者徒為之名而已則榖梁謂讓者不可據矣至公羊以桓為幼而貴必以桓為嫡其失與左氏同而謂將平國而反之桓必以隱為讓其失與榖梁同是三家皆未嘗者得其事之實而又不能以經斷也今吾出于千載之下亦安知桓之嫡與非嫡隱之當立桓與否哉徒見元年隱得書正月則知隱之正當五也自二年後終其身不書正月則知隱之欲致國于桓之非正也正而當立則不可以言攝欲致國之非正則無取乎讓惟榖梁所謂先君既勝其邪心以與隱矣已探先君之邪心而遂以與桓為成父之惡者此言為近實則以立桓為邪志者桓非嫡也以與桓為成父之惡者隱非正也故善言春秋者不得于義則求于事故吾以晉侯執曹伯畀宋人者為闕文不得于事則求于義故吾以桓非嫡而隱不當致國為不正吾之于春秋亦如是而已矣三傳言隱公之事既不同其釋經亦意各異左氏曰為其少故也吾將授之矣此但記隱之欲讓桓而已而不言經之豫奪左氏不傳經宜其不能知公羊曰隱長又賢諸大夫扳隱而立之隱于是焉而辭立則未知桓之將必得立也且如桓立則恐諸大夫之不能相幼君也故凡隱之立為桓立也詳二傳之意似為惠公欲立桓而諸大夫與隱公恐桓幼不能為國又恐已終辭而桓或為他公子所奪故已不得已而攝君爾未論其讓惠公欲立桓而諸大夫立隱則已廢其君之命矣大夫廢君命而已從之雖曰為桓已獨無廢父命以為嫌乎尚何論正不正也惟榖梁曰先君之欲與桓非正也邪也雖然既勝其邪心以與隱已探先君之邪志而遂以與桓則是成父之惡也若爾隱之立乃受于惠公諸大夫與其攝皆無與焉以經意考之則榖梁之言為近實蓋均非嫡也惠公以隱長且賢雖愛桓而不敢私隱乃為讓以取禍是惠公授以正而隱承之以邪故二年以後終篇不書正月所以治隱而榖梁以為春秋貴義不貴惠信道不信邪者惟能察事之實所以能盡經之義也公羊既以隱為諸大夫所立于是創為桓幼而貴隱長而卑之論而為說曰立嫡以長不以賢立子以貴不以長桓何以貴母貴也母以子貴子以母貴何休從而言禮嫡夫人無子立右媵右媵無子立左媵左媵無子立嫡姪娣嫡姪娣無子立右媵姪娣右媵姪娣無子立左媵姪娣吾考于禮皆無見不知何休何所據而又強謂隱桓母皆媵而桓母為右媵此乃以意臆之以成公羊之說而已且立嫡以長不以賢猶可也立子以貴不以長此何理乎貴賤之辨為嫡庶爾安有于媵姪娣之間又以左右為貴賤者天子諸侯無適子其立庶子德鈞以年年鈞以卜古之道也故周官大詢之禮三詢立君居其一未有不問賢否為但以衆妾之左右為先後者立嫡之不以長幼賢否此防為自賢者以庶奪嫡非聖人之得已也若均庶子安得不先賢以聼國人之所與乎衛人立晉春秋尚許之況隱公受命于父吾以是推之不惟失經之意又以見三傳欲成其說而增損事實以相遷就者其弊不獨左氏為然也邾儀父魯附庸也附庸之名見于詩其制見于禮王制孟子而不詳周官載邦國之法甚備而無附庸春秋有附庸之國而經不載其名學者多不能了王制曰公侯田方百里伯七十里子男五十里不能五十里者不合于天子而附于諸侯曰附庸此其大略也孟子之言正同而周官大司徒職方氏乃言諸公之地五百里其食者半諸侯四百里諸伯三百里各食其三之一諸子二百里諸男百里各食其四之一鄭司農謂此兼附庸食者食其租稅餘者其附庸以屬天子積而數之雖男國百里食四之一為五十里故鄭氏謂與今五經家合自子而上皆過其正封之數康成謂皆封國正數附庸又居其外嫌王制與周官不合乃言商因夏爵三等有公侯伯而無子男武王更立五等爵地猶用商制至周公斥大九州之界始併其地廣之以合大司徒職方氏按武成言反商政政由舊列爵惟五分土惟三孰謂商無子男至武王始立乎孟子曰天子之地方千里諸侯之地方百里周公封于魯為地方百里非不足而儉于百里今魯方百里者五子以為有王者作則魯在所損乎在所益乎子産曰天子之地一圻列國一同自是以衰今大國多數圻矣若無侵小何以至焉由此觀之周固未嘗有廣于百里之地百里之外皆僭有也而況五百里正使如先鄭說兼附庸亦不應百里而倍者四附庸反多于正封是五服之內附庸之國多五等之國少矣康成必欲成其說故以開方之法積之又謂公無附庸伯侯而下有附庸别為九同七同五同二同之制後言魯于周法不得有附庸且既曰諸侯牧正帥長及有德者得有附庸矣而公獨以地廣不得有可乎曰侯附庸九同魯侯爵也反謂于㕯法不得有其言自相錯謬殆不可曉吾以王制武成孟子子産為證則周五等國至百里而止矣未之有加也若附庸則惟公得正有也皆因其閒田與諸侯有罪所削之地附之于其鄰有功德者賜之初不以為常此詩所謂錫之山川土田附庸者也至春秋之世王政不行無復有閒田地之賜而諸侯以大並小各以自廣無復限斷故孟子以為取彼子産以為侵小其存而曰附庸者皆先世之舊或奪人之國屬之以為已有者也若司徒職方氏所言則孟子所謂諸侯惡其害已而去籍者私自益其文爾蓋在孟子之時固已謂其詳不可聞況于後世乎開方之法不見于經大司徒言五百里而下五等之國初不言開方之積故二鄭自為兩說至職方氏言邦國千里封公以方五百里則四公而下蓋開方之法然謂之四公六侯之類則非實數也假千里之地言之以為積其數者如是爾故康成亦以為設法以待有功之言吾意大司徒言建邦國縣師言造都邑量其地而制其域者既開方之法後世因竊之則為五百里而下五等之國豈别以益其文乎王制之書駁矣獨言封國之制與孟子合冝為近正故其末概言方千里者為方百里者百而其下列封方百里封方七十里封方五十里而無五百里五等之數此乃先王開方制地域之遺法所以相繼言名山大川不以封其餘以為附庸閒田諸侯之有功者取于閒田以祿之其有削地者歸之閒田附庸少而正封多亦近于人情尤可見大司徒職方氏所言妄無疑也蓋先王以五等諸侯兼附庸不積附庸以為五等諸侯康成不悟此乃以為諸侯有功則受公地自四百里而進附庸九同伯有功則受侯地自三百里而進附庸七同等漫然皆無所據夫謂有功而加地可矣豈必足其數而遞進之乎至于公之地五百里進則逼天子故復為公無附庸之說左右遷就惟其意之所欲而歷世諸儒方守之而不敢易其不能辨周官之非亦無足怪矣三代迭興五等諸侯非有大過誅滅皆因而不易孟子言周官滅國五十則非此五十國皆商之舊所謂附庸者亦包于其間矣其不能五十里或初封自不足其數或有罪而削之或弱而為強大所侵皆不可知至周自積其閒田與削地所入以錫其諸侯者則疑各使其所附之國擇其臣之賢者或有功者而君之焉而于經無見宣十二年楚子滅蕭杜氏以蕭為宋附庸國而孔氏疏以為蕭大夫大心平宋萬之亂宋桓公封叔于蕭為附庸此或有之周官典命言公之孤四命以皮帛眂小國之君小國之君子男也先鄭謂九命上公得置孤卿一人而無所據但因文以為說爾說者以為即附庸之君以吾考之其言是也孔子言顓臾在魯邦域之中為社稷之臣此所謂附庸則大國皆得臣其附庸矣大宗伯六瑞等邦國至男執蒲璧而止繼言六摯等諸臣首曰孤執皮帛大宗伯所謂諸臣即典命所謂五等之命之諸臣也今于子男之後列國諸臣之首冠之以眂小國之君臣而得眂君非附庸而何豈有均為五等之侯而其孤卿得與子男並者乎世子攝其君未誓于天子亦以皮帛繼子男世子有君道也誓于天子下其居之禮一等公之子得如侯伯執圭則未誓于天子繼子男得如附庸執皮帛亦冝矣蓋皆有君道者也故孤之禮每與子男世子為别不與卿大夫為别也儀禮大射鄉射燕禮皆列諸公之位在卿大夫上而每與其君相先後鄭氏皆以為公之孤卿吾以為不然既曰公之孤卿矣不應更得稱公與其君同若以為附庸如五等諸侯皆得稱公則不嫌于與其君同稱也曲禮九州之長入天子之國曰牧于外曰侯于其國曰君于內自稱曰不榖于外自稱曰王老庶方小侯入天子之國曰某人于外曰子自稱曰孤玉藻諸侯之于天子曰某土之臣其在邊邑曰某屏之臣其于嫡以下曰寡人小國之君曰孤擯者亦曰孤由是推之則孤蓋庶方小侯與小國之君也鄭氏釋庶方小侯為戎狄子男君此亦未然所謂附庸之君者殆謂是歟蓋以服言之則在子男之下卿大夫之上以掣言之則諸侯之嫡子未誓于天子者同非人臣也天子自稱曰豫一人諸侯自稱曰不榖則附庸之君自稱曰孤亦冝矣故凶禮天子降名則稱不殺周王告子帶之亂曰不穀不德是也以天子而同諸侯者也諸侯降名則稱孤宋答魯弔大水曰孤實不敬是也以諸侯而同附庸者也各下其一等以自貶損則孤之為附庸無疑矣吾既以公之孤為附庸附庸惟公得有侯伯而下無預則二鄭所謂五等諸侯通有附庸者其說皆不可行然周之公國惟杞宋二王後雖周公猶為侯國則春秋之世安得尚有附庸雜見于他國乎蓋典命所言成周治世之法也公之附庸公國所應有故謂公之孤而侯伯附庸必有功德者則賜不以為常子男之國則小矣吾疑其無附庸先王制禮其隆殺必有髙下是以春秋附庸多見于齊魯晉三大國其他小國無聞所謂不能五十里者未必皆近五十里之數董仲舒繁露解氏不若人人不若名名不若字四等皆為附庸而謂言字者方三十里名者方二十里人氏者方十五里此雖不經見然春秋書邾儀父以字見郳犁來以名見介人以人見則其言固有證也王之大夫四命春秋以氏字見如仍叔榮叔之類則附庸四命亦當以國與字見儀父是已而左氏曰邾子克也未王命故不書爵曰儀父貴之也蓋謂公攝位而求盟夫國君而無爵未之有也既以無爵故稱字而又以為以字貴此其說自相戾榖梁曰邾之上古微未爵命于周也亦非是既為周臣矣安有至于春秋而未受玉爵者則何以為國且謂父為男子之美稱此概論父之為義可也豈春秋以為美而加之者乎公羊曰子之君何以名字也何以稱字裦之也蓋用其名不如字之例且春秋諸侯有善而與之者有也必見于其辭未有舍其爵而言其字者況諸侯有不協而後盟本非是美事隱公初立而儀父來盟是有不信隱公者亦何足為褒乎三傳皆不正邾為魯附庸故求其舍爵稱字之義而不得強以求盟為美是既失名字之例又因並失裦貶之道也用兵言克通春秋特假一見象日以殺舜為事及其即位于四凶則誅之于象則但置之有庳或曰放之或曰封之均于不殺也夫在羣臣則誅之在弟則恕之舜用法豈有二哉四罪之亂天下者公也象之欲殺己者私也舜不以公義勝私思則親親之道然也周公使管叔蔡叔監商管叔以流言挾武庚而叛召公不說文武之業幾墜矣周公以二伯自請于東征曰我之弗辟無以告先王三年而後致辟管叔于商囚蔡叔于郭鄰管叔之事非周公之所得私也然以王命討叛必待三年而後定者其猶有文告之辭威讓之令以待其服不服而後加之兵者歟殺非周公之得已也而區區猶録蔡仲以為卿士蔡叔卒而復邦之蔡不絶其後周公之不欲殺管叔亦致其為親親者爾舜之封象周公之誅管叔或殺或不殺乃其心則一也鄭莊公克弟假則非是矣段之罪未至于殺也使莊公能于其漸絶之則已矣夫必待惡積而不可掩然後始用兵焉豈以奪己之惡而必不與之共國哉春秋所以特書一見也蓋克之為言終必至焉而已者也葬而書雨不克葬日下昃乃克葬見其必欲葬而後已也納而書帥師弗克納見其可納而不終納也然則克之為言在我而已此春秋之義也天王使宰咺來歸惠公仲子之賵王使榮叔來歸成風之含且賵二事正同成風特去天以貶王者成風僖公嘗致其為夫人故也古者辨嫡庶之分甚嚴無以妾為妻雖葵丘之盟猶以為首僖公之罪天王所宜正也既不能正又歸其含賵後復會之葬是成其為夫人也非王所以法天之道故不得不貶王仲子非夫人特賵人之妾爾其過薄于成風故不加之王而貶其使去爵邑而見名此經重之序所當然也而劉氏獨不以仲子為深責乃以宰為氏謂王之下士而當以名見何劉氏詳于成風而略于仲子如此乎蓋迷于宰無去爵邑之道春秋之褒貶亦何常之有第以義次之云爾凡天子諸侯使大夫求財物錫命盟聘納幣歸賵之事未有言不言使者以大夫近尊嫌于不能使也其不言使者非當喪未君既使非其道奪之而不言或制在大夫以見其非所使其義固各有當天子之下士諸侯之上士以下一命之微者稱人皆不言使蓋一命不得以名見辭無所寄且士卑也不嫌于不能使故略之而王人子突救衛獨以字見人臣無褒王之道以子突稱字見也至于將則皆不言使或曰將在軍雖君命有所不受非與之專也以為師之所往勝敗繫焉非君之所得制義或然也至于內則皆不言使入內而出不疑于非君命故一以如見之蓋如之為言順也以順行則非自專可知矣惟臧孫辰告糴于齊不言如見臧之自為且以責莊公之不能為國故變文以示之而陳侯使袁僑如會齊使國佐如師言使又言如者于使之中見其于會與師有順而從者故不嫌于並稱也祭伯內諸侯也天子立三公九卿二十七大夫八十一元士此王官之數九卿三孤在焉書稱三公官不必備惟其人三孤二公𢎞化則亦必待得其人而後任之故周官三槐九棘有三公三孤之位而無其職六卿蓋六官之長皆以上大夫為之則在二十七大夫之內其爵列為三等公曰公卿曰伯大夫曰子其見于經則周公祭公祭伯毛伯召伯劉子單子是也未有功德皆食采于王畿之內所謂內諸侯也有功德而出封于外則皆加一等大夫四命出封為子男則加五命公八命出封為上公則加九命所謂外諸侯也外諸侯之地公百里侯伯七十里子男五十里故卿大夫食于畿內者公視公卿視侯伯大夫視子男外諸侯世則父死子繼所以崇德報功內諸侯祿則父死子不得世其爵食其祿而已卿有家故得臣其國人大夫未有家則不得臣其國人其稱曰主三世而後得臣焉此功德之辨而內外之分也其元士視附庸不及五十里則周官載師所謂近郊之地士田而王制言天子縣內開國之外其餘以祿士以為閒田者也諸侯之卿大夫士則不得有邑以其國中之地制農田百畝之分上農夫食九人至其下士視上農夫祿足以代其耕目是倍之中士倍下士上士倍中士下大夫倍上士卿四大夫祿君十卿祿次國之卿三大夫祿小國之卿倍大夫祿君亦皆十其卿其餘皆貢于王與其國之用此先王盛時之制而春秋之際各自封其臣皆有邑楚既僭王諸臣皆曰公而封縣如魯之作三軍賦入于其私者邑又不足言矣外夫人公子大夫卒不書內夫人公子大夫卒書或曰內魯非也卒之為言非記其死之謂記其禮之謂也古者大夫卒小斂大斂君皆預其服三公六卿錫衰大夫士疑衰雖士亦有服矣此卒之禮也公子而上亦然舉是禮故書卒傳所謂得卒不得卒者也他國夫人太子大夫死雖來赴而無服則何卒之云乎君赴于他國之君曰寡君不祿敢告執事夫人曰寡小君不祿太子曰寡君之適子死大夫赴于他國之君曰君之外臣寡大夫某死此列國相赴之辭也禮天子諸侯絶期非謂不為之服謂其尊無與抗則絶而皆臣之也故雖兄弟之親不得以屬通古者鄉飲酒之禮一命齒于鄉里再命齒于父族三命而不齒蓋自上士而上已不與其父族齒齒者施之鄉里不施之朝廷而况于君乎乃其親親之服則未之或改故齊王姫之卒莊公且為服大功則凡經書卒者非為記其死記其為之變也是以姑姊妹女子子皆在焉絶期者義也為之變者思也乃兄弟之既仕于朝者以大夫之事言則大夫三命而後氏兄弟亦三命後氏稱公子絶期之義也以兄弟之事言則雖氏公子捨其氏而稱兄弟為之服之義也非直以責其為君者而已亦以責其為兄弟者所以厚天倫之愛也故經凡大夫而以兄弟見者皆責其有不滿于兄弟者也則書盜殺衛侯之兄縶之類是也亦有愛之而任以大夫之事以兄弟見者蓋以責其私于兄弟也則書齊侯使其弟年來聘之類是也其以責其為兄弟者則陳侯之弟招殺陳世子偃師者是也公子益師所謂三命之卿也故以名氏見先王之制天子六卿皆六命其大夫四命諸侯三卿公侯伯大國次國之卿皆三命其大夫再命其士一命小國子男之卿再命其大夫一命其士不命此周官典命之制也大夫三卿皆命于天子次國三卿二卿命于天子一卿命于其君小國二卿皆命于其君二卿當為三卿上脫一卿命于天子一句此禮王制之文也故有王命之卿有君命之卿命卿命于王故或謂之命卿或謂之亞卿或謂之少卿君命之卿雖出于其國然王既許之則非其私也王之上士三命以名氏見如劉夏石尚之類諸侯大國次國之命卿皆三命亦當視王之上士以名氏見則公侯伯之臣凡書名氏者皆卿也王之中士再命以名見如實之類諸侯大國次國之命大夫與小國之命卿皆再命亦當視王之中士以名見則公侯伯子男之臣凡書名而不氏者皆其大夫與卿也王之下士無以稱皆曰人大國次國之士小國之大夫皆一命亦當視王與大夫也然以傳考之伯子男之臣凡書人者皆其士與大夫也然以傳考之春秋列國之臣未必皆命于王與其君如禮所言其命焉者亦未必皆如古制古者士二十而冠三十而有室四十始仕五十命為大夫服官政自一命以上必以次進未有生而貴者故葵丘之盟曰官事無攝莊二年公子慶父帥師伐于餘丘以名氏見此次國之卿也然桓以三年娶文姜于是方十八年慶父審為文姜所出或為庶子尚未及冠則未至于十五也翬先以名見後以公子見自大夫而次為卿也慶父先未嘗以名見一書而見名氏則未必以其次進也桓終身不朝王至莊公立而始錫命其臣固無得有受王命者則未必命于王也三者皆無一得則他國凡見名氏者果皆如禮之云乎晉自文公以後皆以三軍將佐為卿文之八年士縠始與梁益耳為中軍將而二年垂隴之盟士縠已以名氏見則縠非晉之正卿也襄之三十年鄭良霄死始以公孫假為卿而二十九年城杞之役假已以名氏見則假非鄭之正卿也河曲之戰趙穿赴秦軍穿非將也而趙宣子曰秦獲一卿則蓋有非卿而從卿者矣鄭葬靈王上卿有事子展使以公孫假往伯有以其官卑曰弱不可子展曰與其莫往弱不猶愈乎則鄭蓋有非卿而攝卿者矣至于其數亦不可盡考即魯而言公子慶父公子結公子牙臧孫辰以四卿見莊公孫敖公子遂叔孫得臣季孫行父叔彭生以五卿見文季孫行父仲孫蔑叔孫豹叔老叔弓仲孫速仲孫羯仲孫何忌臧孫紇以九卿見襄叔弓叔孫婼仲孫貜季孫意如公子憗叔輒叔詣仲孫何忌以八卿見昭雖其間不無死而代者然不應如是其多也晉禦秦師趙盾荀林父郤缺臾駢欒盾胥甲皆在傳謂六卿相見于諸浮則晉蓋有六卿焉韓起聘鄭子齹子産子太叔子游子旗子柳皆從傳謂六卿皆餞于郊則鄭蓋有六卿焉非直六卿而已郤至獻楚捷于周而語伐單子謂至位于七人之下而求掩其上晉又有八卿矣鄭伯享趙孟于埀隴子展等從趙孟曰七子從君以寵武也鄭又有七卿矣由是言之諸侯之卿蓋無復先王之舊制春秋以為誅之則不可勝誅故不以其合禮與否例以卿書之蓋春秋之作有不加貶絶而如其事者有變以異文而為之義者是非之未審情僞之未辨將以别嫌明微則不可不示義其事為甚著其法為甚明不待辭而目見已舉其事而法不可逃故諸侯盟㑹征伐之序各從其次而未嘗易卿大夫命不命與多寡之數各從其所見而未嘗革如是而後可知其為綱紀文章者盡廢而亂之極也公羊穀梁有據經而言義者有據事而言經者然時猶不免有失其又有無事而鑿為之說以言經者則不知其何據以為事云爾耶則何不載之傳以為不見其事耶則何以為是說如無駭帥師入極之類春秋書入邑入國多矣但見其入之為罪爾此先書莒人入向公羊曰入者得而不居也穀梁曰入者內弗受也繼而書入極其辭與入向初無異而公羊曰疾始滅也穀梁曰滅同姓貶也且經不言滅極又未知極為何姓二氏安知入之為滅而極為同姓乎此蓋但見無駭不氏以為貶故意其當然爾公羊又言此滅也其見入何內大惡諱也是知滅之無據故復出諱內大惡以實其言而穀梁亦言苟焉以入人為志者人亦入之矣若以此言為貶則當先施之入向何今方施之入極此亦欲重無駭之罪故移彼于此乃知不明大夫不氏之例遂縱橫廣為多辭以幸或中其實皆非有聞于經者也親迎逆女本是二事兩禮不相干吾固言之矣親迎見于六禮而逆女不預蓋逆女非婚禮之正在他國則逆在國中則不逆不可以為常也自公羊穀梁誤合為一皆以經書逆女為譏不親迎故學者至今莫能辨凡經言迎與逆皆以客主為别迎寒逆暑所主者陽也暑以陽為主而我為客故言逆寒以我為主而陽為客故言迎非止此也鄉飲酒言迎賔而祭言逆尸亦鄉飲酒以我為主故也今女在他國以父母為主故言逆迎在吾國以壻為主故言迎二名豈可亂哉推其失蓋自不知讀禮之過也士昏禮昏既告期有日矣初昏父醮子而命之曰往迎爾相承我宗事子諾而往迎既奠鴈于堂降出授婦綏御輪而先反此親迎之禮也非獨士為然昏義父親醮子而命之迎男先于女也子承命以迎主人筵几于廟而拜迎于門外壻執鴈入揖讓升堂再拜奠鴈蓋親授之于父母也降出御婦車而壻授綏御輪三周先俟于門外婦至壻揖婦以入共牢而食合卺而酳所以合體同尊卑以親之也蓋天子諸侯無不皆然以其行之在初昏之時故謂之昏禮則親迎云者昏之日事豈謂越竟而逆者乎以情度之凡娶于他國皆前期逆而至于國然後以其日迎爾是故郊特牲男子親迎男先于女剛柔之義也壻親御授綏親之也親之也者敬而親之先王之所以得天下也出乎大門而先男帥女女從男夫婦之義由此始也曾子問女在塗而壻之父母死如之何子曰改服布深衣縞總以趨喪女在塗而女之父母死則女反如壻親迎未至而有齊衰大功之喪則如之何子曰男不入改服于外次女入改服于內次然後即位而哭是皆一時之事非謂越境言也其在詩東門之揚陳風刺男女多違親迎女猶有不至者日昏以為期明星煌煌則亦非前期之所言也著齊風刺時不親迎日俟我于著俟我于庭俟我于堂則亦非越境之所譏也知此則知逆之非迎也公羊穀梁既誤逆女之說左氏初不為義但于祭公逆王后于紀曰禮也劉夏逆王后于齊曰卿不行非禮也文公逆婦姜于齊亦曰卿不行非禮也度左氏之意似謂惟天子親迎非天子則不親迎故杜預為之說云天子不親迎使卿逆而公監之諸侯有故則使親逆或者以詩文王親迎于渭與孔子答哀公問合二姓之好為天地宗廟社稷主冕而親迎者謂雖天子亦親迎又言詩韓奕于蹶之里者為卿大夫親迎之證至唐趙氏始言天子無敵于天下女嫁于諸侯使同姓諸侯主之適諸侯諸侯莫敢有其室所謂為天地宗廟社稷主者以魯有郊祀天地之禮非為天子言也其說亦本于杜預雖稍異于二氏而終不悟逆女非親迎是以妄意之而卒莫得其正以吾考之昏禮有親迎特以見男下女之義一事爾先生以禮治天下蓋有大于此者四時巡守各止于方嶽之下會諸侯而朝焉未有貶而下適于諸侯之國者所以明其尊也諸侯各有宗廟社稷之主非朝王不出竟相與盟會之事皆後世之末造亦未有舍其位而之他國者所以一其尊也禮孰大于尊尊何至昏禮而易之乎文王遷國于豐在渭水之涘渭水出鳥鼠同穴豐其所經過渭非國也安知其必竟外而為逆女蹶父周卿士也韓奕本美宣王能錫命諸侯曰以其介圭入覲于王因以及其娶妻之盛蓋因覲而娶非為娶而逆也二詩皆不足為據學者求之禮而已外臣盟會魯不預焉皆不書于經盟惟隱二年紀子帛莒子盟于密一見會惟昭二十七年晉士鞅宋樂祁犂衛北宫喜曹人邾人滕人會于扈一見謂來赴則書夫豈終十二公而外臣之為盟會者僅兩見乎蓋皆以魯故録之也紀子帛之事固以平莒怨得以字見褒矣而扈之會蓋以謀納昭公也左氏知其事而不能言其義公羊穀梁不知其事故皆略而不為說吾然後知三家言經或知其事而不知其義或不知其事而併失其義有如此者以傳考之昭公初出所依以為重者齊而已齊既不能援而後始求于晉方會扈時公猶如齊未如晉也始宋公既謀納公不果而卒于曲棘衛靈公復欲以文之舒鼎成之昭兆定之鞶鑑賂諸侯以納公故是會樂祁犂北宫喜實尸之士鞅取賂意如辭二子而不果則安可不録乎惜乎祁犂喜不能伐鞅之謀抗之以大義乃與士鞅俱以名見不然無愧于紀子帛矣左氏復兼成周言之蓋徒見前年天王入于成周夫成周之役在五年後而宋仲幾方以不即工見執烏在其為合謀乎大抵左氏不傳經而意臆之常為兩說以幸多中然于經不能無害學者所貴乎愼取也賊賢害民則伐之負固不服則侵之大司馬九伐之法也而三家皆莫能辨伐與侵之異吾獨有取于趙宣子之言所謂伐備鐘鼓為聲其罪侵襲密聲為慙事者其言為有證故鄭氏釋周禮謂伐者兵入其竟為鐘鼓以往所以聲其罪侵者兵加其境而已用兵淺者以詩考之皇矣言以伐崇墉伐既及墉則固至其城下矣而侵自院疆侵以疆言是未入于國中也秦誓亦先言侵于之疆而後言取彼凶殘殺伐用張亦侵淺而伐深大抵罪大則伐罪小則侵伐者自主兵之國即問罪故鳴鐘鼓侵者至其所侵之國然後問罪故不鳴鐘鼓或入國中或在國外各入其服之遲速爾學者不悟遂謂侵不用鐘鼓豈有為師而無鐘鼓者乎蓋不知此特興兵之初作不作之辨左氏之言自不能了也會伐會侵皆不言勝敗侵伐討罪之名也古者雖有征討之師諸侯有罪必以文告之辭威讓之令先焉若服而行成與賂而求免或有大國之援來救或不服而自還皆不至于戰而解自不得以勝敗言也惟不服而交兵志其後事則不書侵伐而以戰見然後勝敗可見矣齊小白伐楚管仲問楚以包茅不入昭王南征不復為辭楚子曰貢之不入寡君之罪也敢不供給昭王南征不復君其問諸水濵猶未盡服則次于陘至使屈完來盟而後退于召陵此復而免者也燕人出簡公齊侯將伐燕以納之次于虢燕人行成曰敝邑知罪敢不聽命先君之敝器請以謝罪公孫晳請許之遂為濡上之盟燕人于是歸瑤罋玉櫝犖耳而還此賂而免者也魚石入彭城楚子鄭伯伐宋楚人侵宋以救彭城宋華元如晉告急晉侯師于台穀遇楚師于靡角之谷楚師乃還此救而免者也楚子為庸浦之役使公子貞伐吳于棠吳人不出公子貞以吳為不能而還此不終伐而自還者也若此之類甚多傳皆以為行成或取行成者平也必其不服故以戰請秦伯伐晉惠公逆秦師使韓簡視師遂使請戰曰寡人不佞能合其衆而不能離也君若不還無所逃命秦伯使公孫枝對曰君之未入寡人懼之入而未定列猶吾憂也苟列定矣敢不承命于是為韓之役春秋不記秦伐而記晉戰齊伐魯北鄙遂以侵衛魯乞師于晉而從齊師于莘齊侯使請戰曰子以君師辱干敝邑不腆敝賦詰朝請相見對曰晉與魯衛兄弟也來告曰大國朝夕釋恨于敝邑之地寡君不忍使羣臣請于大國無令輿師淹于君地能進不能退君無所辱命于是為鞍之役春秋不記魯伐而記魯戰是以勝敗得著焉圍亦不言勝敗者圍者不服而進逼之亦未至于戰也圍而入之則書入圍而滅之則書滅不服而戰焉則書戰不然苟如伐而免者則亦圍而已矣天下無道禮樂征伐自諸侯出孔子以十世言之鄭人伐䘙或曰此春秋所以目始伐也亦未必然隱桓之間凡用兵盟會伐圍多宋鄭齊衛魯五國為主而陳蔡以人從以禮考之二伯方伯皆得專征者也外諸侯稱嗣雖其先皆擇有功德者為之死而亦必傳其世衛人責宣公不能修方伯連帥之職是也自周召分陜而管蔡之討周公親焉則周召者文武成王之二伯也康王立太保率四方諸侯入應門左畢公率東方諸侯入應門右是時周公已死矣召公宜以次遷而畢公繼之則召公畢公者成康之二伯也管仲言召康公賜太公五侯九伯汝實征之則太公亦一老矣不知當何時其曰召康公賜之康公召公也宜與畢公相先後則太公亦成康之二伯也諸侯從桓王伐鄭左氏記虢公率陳人蔡人周公黑眉率衛人則虢公周公者桓王之二伯也成王封康叔而告之曰孟侯孟侯猶元侯也則衛康叔為成王之方伯矣周之東遷晉鄭焉依平王錫晉文侯命則晉文侯為平王之方伯矣鄭徙國于虢鄫之間桓王以武公莊公為卿士伐宋之役左氏以鄭伯為以王命討不庭則鄭武公莊公為桓王之方伯矣宋二王後爵為上公雖不知其得專征與否而陳人請宋伐鄭曰君為主敝邑以賦與陳蔡從則疑亦為方伯者也略以是考之自周召畢公後齊嘗為二伯宋晉魯衛鄭皆嘗為方伯至春秋初相去未逺則隱桓之間豈五國皆得承其先君之後而天子復命之為方伯者與至其微弱或不能自振而廢其職或有罪而天子絶之不可知故齊衛胥命于蒲以自營至齊小曰興而圖霸天子從而命之齊衰而宋襄圖霸不果晉重耳復繼之于是天下惟霸之從而二伯方伯皆不得盡行周禮所謂征伐自諸侯出者非以其不得專征也謂其不能如文王以天子之命命將帥不請于王而自行之此春秋所以譏也春秋考卷四
