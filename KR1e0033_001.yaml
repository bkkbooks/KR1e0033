body:
  text: 春秋考卷一宋葉夢得撰統論孟子曰齊之乘楚之檮杌魯之春秋一也則春秋魯史之名也然余考之國語晉司馬侯言羊舌肸習于春秋楚申叔言傅太子教之春秋則雖晉楚之史蓋亦名以春秋矣春者陽之中秋者隂之中天道所以生殺萬物者春秋賞罰之法法天者也豈古之史槩以是為名特魯能守之不易乎韓宣子聘魯稱見魯春秋而禮記載殺奚齊與昭公去夫人姓事皆曰魯春秋此非孔子所修也魯之有是名久矣故公羊榖梁或言以春秋為春秋或言不修春秋之類則孔子之作春秋亦史而已故其書之體皆與史同若乘與檮杌其義蓋不可盡考殆諸侯僭亂各私其好以變舊典歟如楚之君初未有諡號皆曰敖其後猶有稱堵敖郟敖者其君之名尚爾則史可知矣古之為書者皆有凡有目凡者其略也目者其詳也其設官則尊者治其略卑者治其詳故周官有官府之八職師掌官成以治凡司掌官法以治目未有一官而無副二者也以大史小史推之大史言掌建邦之六典而小史言掌邦國之志則大史宜尊而治凡小史宜卑而治目二者更相備也故經者史所謂凡者也傳者史所謂目者也而學者多言春秋自為一經不期于傳而自明豈有是哉且如公子翬實弒隱公而經不載翬弒趙盾非實弒君而經加之弒晉文公實召襄王而經言狩季孫意如實逐昭公而經言孫若不假之傳則其事何從而見以左氏考之若董孤書趙盾弒其君南史書崔杼弒其君孫林父言臣之名在諸侯之策曰孫林父寧殖逐其君以禮記考之若言魯春秋晉里克曰殺其君之子奚齊及其君卓魯春秋去夫人之姓曰吳其死曰孟子卒而杜預又載汲冢周書魏史之文曰魯隱公及邾莊公盟于姑蔑晉獻公會虞師伐虢滅下陽周襄王會諸侯于河陽衛懿公及赤翟戰于洞澤之類此猶可略見古史之體使古史之文皆止于此則事之詳後世烏得而聞乎吾以是知春秋者古史之凡而其目則在史第未必為今之左氏爾公羊榖梁多言一事而再見者前目而後凡此雖知凡目之辨而未知經史之别孟子言孔子曰其事則齊桓晉文其文則史其義則丘竊取之矣夫褒貶之義在我而不廢其事與文則春秋案此下原本有闕文專記其人之身雖有所縱失無傷于春秋也而公羊穀梁每為傳疑之説其亦不足以知經之旨矣司馬遷言孔子厄陳蔡作春秋為公羊者證家語孔子厄陳蔡當哀六年而謂孔子嘗言晉文有霸心起于曹衛越王勾踐有霸心起于會稽陳蔡之間丘之幸也以為作春秋之意始于陳蔡至獲麟而遂為書此蓋成其作經在獲麟後之説晉文圖霸之心固已久矣曹衛乃其成事而謂霸心起于此不應疏謬乃爾豈孔子之言哉而司馬遷之論亦未必有據學者自不必深考乃其為説則不可不辨戴宏為解疑論謂西狩獲麟知天命去周赤帝方起麟為周亡之異漢興之瑞且云孔子言丘覽史記援引古圖推集天變為漢帝制名有赤受命倉失權周滅火起薪采得麟之語嗟夫孰謂漢儒而無所忌憚敢至是乎至始隱公為榖梁者曰惠公之初平王猶賴晉鄭未甚衰弱末年陵替始極遂託始于隱夫幽王為犬戎所殺周不得保其王畿而東遷此不為衰弱而區區依晉鄭以為強乎然此言猶不過鄙陋而已乃公羊家言張三世藉位于魯以託王義謂隱公為受命王黜周為二王後故以哀定昭已與父時事為所見之世文宣成襄王父時事為所聞之世隱桓莊閔僖曾祖高祖時事為所傳聞之世遂謂諸侯不得改元隱公為受命王故得稱元年以所傳聞為治之始所聞為升平所見為太平其原皆自嚴彭祖顔安樂始雖未必全出公羊然所見異辭所聞異辭所傳聞異辭公羊自為此論而嚴顏傳于晆孟則其來蓋有自矣為左氏者又曰五經皆無證圖讖明劉氏為堯後獨左氏有明文蓋謂文十三年言士會之族處秦者為劉氏班固漢書亦證漢為堯後孔氏為左氏正義疑漢增此一言以媚于世凡此見兩漢諸儒之罪殆不勝誅尚何足與言經今讖緯諸書雖不傳而其言猶存世之好竒者或未免有所蔽故略為出之此豈直孟子所謂淫辭之所陷邪辭之所離者而已哉惟何休言十二公法天之大數適與吾合吾非取于休取于經也孟子曰春秋天子之事此得之矣猶未盡也夫王政不行以褒貶代天子賞罰以為天子之事可也然諸侯有善惡固可代天子而行天子有善惡則孰當代而行之乎春秋有貶諸侯而去王者矣諸侯而無王則王之所絶也然則春秋蓋天事非止天子之事也故以名取于舊史之文雖同以義取于春秋之意則異凡春秋所書皆天之所為云爾以事繫日以日繫月以月繫時以時繫年歷一時無事則書首月以見時歷一月無事則各于有事之月以見時此雖損益舊文正春秋之所以為天事者也而公羊穀梁皆以為春秋編年四時具而後為年若是其淺哉帝王法天之事無不以十二為節蓋周之為十有二次運之為十有二辰别之為十有二月皆天之所以為天而成一歲者也王者既曰天王矣則無往而不法天故冕十有二旒服十有二章圭十有二寸食十有二鼎分天下為十有二州而十有二歲一巡守而立于天下小而服食器用無不取則不如是不足為天王魯子服景伯曰周之王也制禮上物不過十二以為天之大數也古之人蓋有知之者矣周公制禮以天地四時名官而六官之屬各六十以當期之日亦曰周禮者王政之所由出而王之所以法天者在是也然則春秋作于詩亡而斷自隱公始至于哀公而備十有二公之數其亦以代天賞罰而取其節者歟孟子曰王者之迹熄而詩亡詩亡然後春秋作而序詩者言變風止乎禮義先王之澤也今變風止乎陳靈公在魯宣公之末後春秋百六十餘年二雅止于幽王前春秋四十餘年王者之迹與王者之澤異迹者其政也以二雅言也澤者其化也以國風言也平王之後黍離降于國風所謂詩亡者非無詩無王詩也因緣及于陳靈公之世蓋文武之化猶有存乎人心者至靈公而後絶則春秋之作其以幽王之後平王之初二雅絶而無王詩乎然隱公立于平王之四十九年其在詩亡平王之初則惠公其人也春秋不始于惠公而始于隱公吾然後知均為平王略惠公而始隱公正以足十二公之數以備天道云爾蓋春秋之義不在惠公與隱公則不嫌于去彼而就此是説也何休微得之故言春秋據哀録隱取法十二公天數備足然以所見所聞所傳聞為辨則去之又逺矣故非深明帝王之道而知其所以為天子者未足與議此也春秋諱國惡歟曰然為尊者諱為親者諱為賢者諱歟曰不然春秋公天下信後世之書也所以公天下信後世者為其善惡不敢秋毫加損益于其間也今尊者有罪諱而遷其辭曰是吾尊也親者有罪諱而遷其辭曰是吾親也賢者有罪諱而遷其辭曰是吾賢也二百四十二年之間凡魯君曰孰非吾尊且親而列國之中亦何時而無賢春秋將遷其辭之不暇其所以為公且信者將安施乎然而吾魯臣也其所為魯史也昔者楊子為我拔一毛而利天下不為也孟子以為無君墨子兼愛摩頂放踵利天下為之孟子以為無父君與父吾之所獨非夫人而可同也知為己而不知物則吾之君亦人之君謂之吾君可乎知為人而不知己則吾之父亦人之父謂之吾父可乎古之為臣與子者喪其君與父斬衰三年雖母猶厭而為期是君與父天下所不得同者也墨者夷之葬其親厚謂愛無差等施由親始孟子以為賤其親曰天之生物也使之一本而夷子二本今春秋書魯事未嘗與列國等列國不書即位魯書即位列國不卒葬夫人魯卒葬夫人列國不卒大夫魯卒大夫列國女嫁為夫人不書歸魯內女嫁為夫人書歸列國戰書敗績魯不書敗績案莊公九年戰于乾時未嘗不書敗績此失考列國公與微者會皆書爵魯與微者會非內志不書公如是之類曰內辭焉雖周不得同則夫國有惡如他國焉而直書之春秋亦有二本乎莊子曰蹍市人之足則辭以放驁兄則以嫗大親則已矣以其出于情者異也孟子曰越人彎弓而射之則已談笑而道之其兄彎弓而射之則己垂涕泣而道之為其責于恩者殊也葉公語孔子曰吾黨有直躬者其父攘羊而子證之子曰吾黨之直者異于是父為子隱子為父隱故陳司敗嘗問于孔子曰昭公知禮乎子曰知禮陳司敗曰吾聞君子不黨君子亦黨乎君娶于吳為同姓謂之吳孟子君而知禮孰不知禮子曰丘也幸苟有過人必知之故記言魯春秋去夫人之姓曰吳其死曰孟子卒由是言之春秋之義蓋亦可見矣以為吾之父非人之父也則有美焉有惡焉稱其美不稱其惡所以别乎人之子吾之君非人之君也則有美焉有惡焉亦稱其美不稱其惡所以别乎人之臣也乃春秋將以公天下則有不得而私將以信後世則有不得而誣故其小惡雖愆于禮義而未絶于王法則著其實而使自見如夫人如齊九月用郊之類是也其大惡王法所誅絶不可通于天下則微其辭而徐見之桓無王定無正月之類是也雖隱其迹而使人徐察焉終不沒其實蓋不敢廢其為公也不敢棄其為信也是以隱弒不書而不得葬與列國之君弒而不葬者同謂之非弒可乎滅國不書而滅項不見公與列國之滅國而書者同謂之無滅可乎故曰丘也幸苟有過人必知之夫不畏其有黨而能為法受其過則其為公天下信後世者孔子固自有以處之矣此其所以為春秋者也或問內大惡諱小惡不書春秋之義則固然矣大惡雖諱必婉其辭而微見之所以申臣子之道而不失其為勸懲者也小惡不書則遂沒而不見乎亦各于義而已矣夫人孰無過雖湯不貴無過而貴于改過不吝顏子不貴無過而貴于不二過所謂小惡者謂其不干于法不害于教沒之不為縱失有罪者也縱有罪于義為輕內其君于義為重則沒之可也魯之小過沒而不書者吾不得而知矣乃子般弒而季友出奔內無與主而致季友不敢保其身則莊公之為也始即位既不能強而自立以修其國政又不能弱而朝霸主以幸苟容至于欲討而後見之則文公之為也故季友出奔文公如晉皆沒而不書然季友歸而魯復存則季友之功不可不録故復見季子來歸晉為霸主受公朝而以大夫為盟則晉侯之罪不可不正故復見及處父盟見季子歸則知其嘗出而不書者全其美也見處父盟則知公嘗朝而不書者殺其恥也此春秋之微也春秋內事有諱而不書者有略而不書者諱而不書者所以隱國惡略而不書者所以顯民志國惡之隱所見多矣民志之顯未有能明之者子般見弒季友嘗奔于陳矣不書其出略也至其盟而復國也則書季子來歸夫豈有無出而歸者乎季子者國之所恃以存亡者也季子在則國可存季子出則國必亡故不書其出所以見魯人繾綣不忍使去而欲其留也桓公薨文薑嘗孫于齊矣不書其歸略也至其入而復見也則書夫人薑氏會齊侯于禚夫豈有既孫而復在者乎文薑者舉國之所惡也存之不能討其罪而逐之所以逺其惡故不書其歸所以見魯人厭鄙無所容而欲其去也一隱一顯之間不待加之辭而國人之情昭然著見于千載之下若生乎其時而聞其言者非聖人莫能為也人之所以為人者莫大于禮義國之所以為國者亦莫大于禮義孟子曰羞惡之心義之端也是非之心智之端也夫惟智足以擇是非然後義足以辨羞惡使是非不明于中不惟無恥之恥不能知羞惡正使羞非其所羞惡非其所惡亦何取于義乎司馬牛問君子子曰君子不憂不懼曰不憂不懼斯謂之君子矣乎子曰內省不疚夫何憂何懼夫子之為是言為桓魋也魋之過何纍于牛雖無兄弟庸何傷乎子産為丘賦而國人謗之子産不改以詩禮義不愆何恤于人言為證子産之言則是矣而謂丘賦為善其是非猶未擇也是非之難明惟春秋為能詳故有內諱以殺恥者雖與微者盟猶不以見有當諱而不諱者雖君臣俱辱于大國猶正其辭而不少隱沙隨之會郤犫取貨于叔孫僑如訴成公于晉侯不得見而執季孫行父于苕丘平丘之會十三國並集王人在焉而昭公以邾莒蠻夷之訴辭不得盟皆執其大夫自人言之國之大恥也而春秋書公會晉侯齊侯衛侯宋華元邾人于沙隨不見公公至自會晉人執季孫行父舍之于苕丘公會劉子晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯杞伯小邾子同盟于平丘公不與盟晉人執季孫意如以歸由是言之禮義可不明哉如是而後弒而曰薨奔而曰孫殺大夫而言刺被侵伐而言鄙者君子可以深恥矣春秋立天下之常道以垂萬世者也或者以為亦有從權者焉非也今天下之所以能立者為其有君君臣臣父父子子兄兄弟弟夫夫婦婦而行之以禮樂政刑持之以綱紀文章者也湯武非不仁也孔子曰武盡美矣未盡善也韶盡美矣又盡善也終不以桀紂而易天下之君臣也衛輒受命于靈公而有其國者也孔子曰必也正名乎名不正則言不順言不順則事不成終不以輒而亂天下之父子也何者權者有時而行而常者萬世不可改者也雖大聖人豈以一時之宜而廢萬世之正乎春秋之時三綱亡五常絶凡天下之所以立者無一而不壞矣上無道揆下無法守明王不作既無與出而治之者孔子方將以空言撥其亂而反其正舉其所謂常而不可改者揭而示之天下使昭然如日月之不可掩其明屹然如山嶽之不可易其位幾何而不正乎若是而通其權是以亂濟亂也故曰春秋無權道此其説蓋起公羊以祭仲出鄭忽為知權而春秋賢之者也故謂權者反于經而後有善學者雖知其失而斥之然終不能不以吾聖人言之近似者而惑之也夫可與適道未可與立可與立未可與權孔子固言之矣此豈舍常而用權者哉孟子曰子莫執中執中為近之執中無權猶執一也所惡執一者為其賊道也舉一而廢百也夫道固有常變惟明道者雖守其常而變自存乎其間此君子之所謂權者也世之知常而不知變知變而不知常者皆分乎道而各蔽于一偏則孟子所謂執一而賊道者是也惡覩夫權而議之哉是故春秋朝聘盟會非無善也以為諸侯不得擅相見則未有異文而與之以禮者也戰伐圍取非無功也以為諸侯不得擅相討則未有異文而與之以義者也以類而求凡王法之所不得為者其辭未嘗不一施之焉乃若華元不終于戰而與楚平不可謂不賢而人其變命者不能免也趙盾不終于納捷葘而還不可謂不正而人其專君者不能恕也里克志于立嫡而奚齊之死不得逃于弒趙鞅力于去惡而晉陽之入不得别于叛若是之類雖欲秋毫假之無自而通焉然而等于盟也召陵之役孰不知其仁均于戰也城濮之勝孰不知其義華元可抑而不可廢其平趙鞅可退而不可奪其正則明乎道者固有以處之矣乃孔子則不以是立法也法者可以常立不可以變見者也公羊蓋亦微得于此故常為實與文不與之論幾若近之惟不盡逹乎道是以施之每不當其所故若以夏徴舒人楚而謂之貶專討以宋仲幾人晉而謂之不與專執烏在其為文實之辨歟或曰春秋無權道則然矣若有所謂出乎禮之變與禮之正未嘗不該焉庸非權乎曰非也公羊固云權也反經而後有善是舍常而從變分而為兩之言也聖人之權則異乎是所以著乎禮者固有定制矣而有出于禮之不及備者焉為其不可廢也而以義起之則庶子得為母築宫祭以公子不幸不及其身而至于孫亦從而祭考仲子之宫是也非權也亦所以為禮也所以著乎法者固有定數矣而有出于法之所不及該者焉為其不可已也而以情通之則大夫卒于祭所既不可用樂又不可廢祭姑去樂而存祭叔弓卒而去樂卒事是也非權也亦所以為法也諸侯以時朝王于方嶽正也有不及時而不至于方嶽者不可以非其地而不朝也則朝于王所者有之僖公是也非權也亦所以為尊王也諸侯繼世踰年而即位正也有不及年喪至而得立者不可以過時而不即位也則既殯五日而即位者有之矣定公是也非權也亦所以為定位也若是者其何廢于常乎乃築王姬之館可辭而不辭以是為禮則凡在喪者皆可得主婚矣是謂變禮者也知築宫可祭而因為之獻六羽以是為樂則夫人之廟皆可得用舞矣是謂易樂者也古者諸侯變禮易樂其君流尚何權之云乎此春秋之所以為誅也知此而後知春秋之不用權矣孔子孟子俱欲以王道援天下撥亂世而反之正者也而其行之則不同孔子欲道其常以垂萬世孟子欲乘其變以救一時故孔子之言得天下未嘗不在舜與文王而孟子之説諸侯一以湯武學者固疑之矣不知孟子于孔子蓋相與為終始非深知春秋之義者不能成孔子之志也子謂韶盡美矣又盡善也謂武盡美矣未盡善也是孔子之志雖武王且有所不足必至于舜文而後可矣顔淵問為邦子曰行夏之時乘殷之輅服周之冕樂則韶舞使孔子而得志必將參三王之文質終之以為舜在齊聞韶而三月不知肉味蓋有當于其心也無己則文王焉所謂文王既沒文不在兹乎孔子固自任之矣至于三分天下有其二以服事商者謂之至德此所以立萬世之常法君君臣臣雖極天下之亂盡人道之變終不可易此其著之春秋者也故曰如有用我者期月而已可也三年有成善人教民七年亦可以即戎如有王者必世而後仁善人為邦百年亦可以勝殘去殺其節如是之緩其效如是之遲而孔子終卒老于行而不悔及其病且死則喟然傷之曰明王不作而天下莫能宗豫不知孔子之意以世無賢君不得有天下如舜耶抑抱其可以為王之道不得尺地而行之如文王耶不可知也原孔子之道不自為舜文王則輔其君使為舜文王而已乃孟子則不然曰雖有智慧不如乘勢雖有鎡基不如待時故事半古之人功必倍之環轍于天下而告其君者必曰湯以七十里文王以百里王不待大至于湯放桀武王伐紂則曰聞誅一夫紂矣未聞弒君也甚矣孟子之危言自孔子言之幾若氷炭之不相侔使天下後世不幸真有如桀紂之君在上孔子或自有其位或佐其君將拱手坐視而弗顧耶抑有不得已而權以濟之耶然而諸侯之不專伐春秋之道也陳恆弒其君則孔子沐浴告哀公而請討是諸侯可得而伐也人臣之死職春秋之義也子紏之難召忽死之管仲不死孔子以為桓公九合諸侯一匡天下為管仲之力而與其仁是人臣可得而廢其職也由是言之使孔子而處道之變必有為之所者矣要不可遽言而立法也其所以為萬世之訓也姑正其常而已惟孟子之學足以見孔子之心故其以為君君臣臣父父子子孔子固以天子之事著之春秋雖亂臣賊子聞之而無不懼吾豈復更加毫末于其間哉乃其救民于水火拯民于塗炭使天下匹夫匹婦無不被其澤者則孟子之心亦孔子之心也故取邑取附庸春秋之所禁也而孟子則曰取之而燕民悅則取之征伐自諸侯出春秋之所惡也而孟子則曰為天吏則可以伐之諸侯不得專殺大夫孟子曰國人皆曰可殺見可殺然後殺之新作南門且不可齊宣王欲毁明堂孟子曰王欲行王政則勿毁之矣凡此皆非有異乎春秋充孟子之志諸侯誠有湯武者作發政施仁推其澤于天下兼弱攻昧正有罪而誅之使天下皆為堯舜之民則大國五年小國七年雖使之坐明堂而朝諸侯春秋之所期亦不過如是焉是亦春秋而已矣故惟孟子為善學春秋春秋有可以事見者求以事事不可見而可以例見者求以例事與例義在其中矣有事與例俱不可見而義獨可推者求以義義者理之所在也有事與例與義俱不可見而意可通者求以意意者人情之所同也莫易乎事莫難乎意僖四年春公會齊侯宋公陳侯衛侯鄭伯許男曹伯侵蔡遂伐楚夏許男新臣卒楚屈完來盟于師以例推之許男之卒師猶未還當書卒于師而不言師宣九年九月書晉侯宋公衛侯鄭伯曹伯會于扈晉荀林父帥師伐陳辛酉晉侯黑臀卒于扈以例推之晉侯之卒尚在扈則當書卒于會而不言會此事不可見而又與例違求其義則褒貶無預焉而左氏解許男乃為卒于師而晉侯不為説固不知經也榖梁以許男為內桓師凡推齊侯每異于他諸侯者公羊穀梁之意非春秋之旨也桓師非湯武之兵何內之有公羊解晉侯以扈為晉邑諸侯卒其封內不地此自公羊之誤若為其在會則自當言會不當言地穀梁曰其地于外也其日未踰境也則穀梁蓋不别卒于會卒于外之辨其陋與左氏言許男同矣此皆不得其事與例而強以義求之之過也若以意推之則許男雖從伐楚之師而以疾先歸卒于國中安得不以常例書卒乎不言先歸但以卒見可知其在國中也晉侯雖會于扈而中隔晉荀林父帥師伐陳則會扈之諸侯已散晉侯以疾獨留而卒則安得不以常例書地乎不言其留但以地見可知其非會也此亦孟子論詩所謂以意逆志是為得之者學春秋而至是然後能出傳注之外而察千載之上如在其目前也人之常情有出于自然而不可已者善者人之所共好也見有善焉其推之惟恐其不至也故曰言之不足故嗟嘆之嗟嘆之不足故咏歌之咏歌之不足猶有見于手足以舞蹈者矣不善者人之所共惡也見不善焉其絶之惟恐其不急也故曰牆有茨不可掃也中冓之言不可道也所可道也言之醜也若是者非吾故欲為是别也其出于情者莫知其所由然而然也故春秋之辭有繁者焉有約者焉孔子曰書之重辭之復不可不蔡也其中必有美焉公羊曰春秋辭繁而不殺者正也以經考之會王世子既見首止矣俄而復曰諸侯盟于首止會宰周公既見葵丘矣俄而復曰盟于葵丘一地而再見非止此也宋之盟平丘之會亦然首止所以定世子葵丘所以明王禁宋以弭諸侯之兵而平丘以申天子之制皆君子所謂善焉而不能己者也溴梁之盟大夫固有名矣略而暴之曰大夫盟而不目其人也緣陵之城諸侯固有列矣略而總之曰諸侯城緣陵而不序其人也非止此也兩盟于扈一會于扈亦然溴梁大夫之專命也緣陵諸侯之有闕扈會諸侯之無能為也前扈大夫而專廢置後扈諸侯不能討篡弒皆君子所謂不善焉而不欲道者也是君子所以善善而惡惡者也雖然皆繁也亦有不正其所為而示之以緩而不切之辭者焉霸主執諸侯以歸京師當其罪曰歸于不當其罪則曰歸之于故凡辭間有之于者皆謬悠而不正其所為者也若晉侯使韓穿來言汶陽之田歸之于齊之類何其文之衍也皆約也亦有微而不敢盡示之以特異之辭者焉偏戰皆書某師及某師戰于某某師敗績而內辭不言敗直曰及某師戰于某故凡有不得盡其辭與不必盡者皆直書而不備也若天王崩王室亂之類何其文之約也惟善學者不但知言必知其所以言故曰言豈一端而已各有所當也而况春秋之言乎孔子曰君子成人之美不成人之惡成人之美則天下皆可使為善而無不與之遷善也不成人之惡則天下可使皆不為不善而無不與之改過也其于事君亦然善不積不足以成名懼其以小善為無益而不為也則見一善焉必推之于己惟恐其不專以為非君莫能為也故曰將順其美懼其以小惡為無傷而不畏也則見一不善焉必分之于人惟恐其不逺以為非君所敢為而人為之也故曰匡救其惡春秋內事凡與外諸侯連者荀王法之所禁雖有以為功者皆與諸侯列而序之曰是惡也衆人之所為也分之于衆而不獨責于己則知己不可有是過而不為也盟會征伐之類或言公會或言公及或沒公而不見或略公而不序是也至于城楚丘釋宋公朝王所戍陳戍鄭虎牢歸粟于蔡諸侯皆預焉而獨以內為文曰是美也吾君之所能為也專之于己而不兼取于人則知獨有是之為美而惟恐人之先己而力為也夫然豈獨萬世之為君者皆思慕善而畏惡哉抑凡為人臣者皆將以是為心則其君孰不皆至于善此為君之道而事君之法也春秋無虛加之道此固然矣亦有義之所在而為之變辭者必有見焉然後著之未嘗苟也虞師晉師滅下陽下陽邑也邑不言滅下陽虞虢之塞邑下陽滅則虞亦滅矣以其後見執虞公知虞國之前亡是故可以非滅而言滅也許世子止弒其君買止無弒君之實坐不嘗藥而同之弒也以其後見葬許悼公知賊不討而得葬故可以非弒而言弒也此春秋之微不可不察也公羊雖知無虛加之道貴文公以喪娶至于天王敗績于貿戎曰執敗之晉也以為尊者諱敵不諱敗與穀梁以戎伐凡伯為衛者同夫如是縱失晉無王之罪而加戎以亂華之咎未聞春秋善善惡惡而如是者也大抵公羊穀梁多主諱而不逹經旨如無駭滅極為諱內大惡而言入宋公入曹為諱滅同姓而言以歸之類凡此皆不疑于虛加而獨疑于喪娶而不知其説也春秋考卷一
